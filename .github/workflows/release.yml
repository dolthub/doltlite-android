name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "Core release tag for the dry run (defaults to latest)"
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Test Android release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.engine.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the matching DoltLite engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: ${{ inputs.engine_tag }}
        run: |
          tag=$ENGINE_TAG
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag=$GITHUB_REF_NAME
          elif [[ -z "$tag" ]]; then
            tag=$(gh release view --repo dolthub/doltlite --json tagName --jq .tagName)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          version=${tag#v}
          archive="doltlite-autoconf-$version.tar.gz"
          gh release download "$tag" --repo dolthub/doltlite --pattern "$archive" --dir "$RUNNER_TEMP"
          mkdir -p doltlite
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C doltlite
          test "$(cat doltlite/.dolt_release_version)" = "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build native libraries for all four Android ABIs
        env:
          VERSION: ${{ steps.engine.outputs.version }}
        run: |
          ndk=$(sed -n 's/^doltliteNdkVersion=//p' gradle.properties)
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;$ndk"
          bash scripts/build-libs.sh "$PWD/doltlite" "$VERSION" "$ANDROID_HOME/ndk/$ndk"

      - name: Assemble and stage the AAR
        env:
          VERSION: ${{ steps.engine.outputs.version }}
        run: |
          ./gradlew assembleRelease -PdoltliteVersion="$VERSION" --no-daemon
          ./gradlew publishAllPublicationsToCandidateRepository -x :bundleReleaseAar \
            -PdoltliteVersion="$VERSION" -PdoltliteCandidate --no-daemon
          aar="doltlite-android-$VERSION.aar"
          cp "build/candidate-repository/com/dolthub/doltlite-android/$VERSION/$aar" "build/$aar"
          cmp "build/outputs/aar/doltlite-android-release.aar" "build/$aar"
          python3 scripts/verify-aar.py "build/$aar"

      - name: Build the consumer from the staged Maven package
        env:
          VERSION: ${{ steps.engine.outputs.version }}
        run: |
          ./gradlew -p consumer assembleDebug assembleDebugAndroidTest --no-daemon \
            -PdoltliteVersion="$VERSION" \
            -PdoltliteCandidateRepository="$PWD/build/candidate-repository"

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the packaged native library on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VERSION: ${{ steps.engine.outputs.version }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/run-android-smoke.sh "v$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: android-candidate
          path: build/doltlite-android-${{ steps.engine.outputs.version }}.aar
          if-no-files-found: error

  publish:
    name: Publish verified Android release
    if: github.event_name == 'push'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-candidate
          path: candidate

      - name: Create GitHub release with the tested AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aar="candidate/doltlite-android-$VERSION.aar"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$aar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$aar" \
              --title "doltlite-android $VERSION" --generate-notes
          fi

      - name: Publish the tested AAR to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          aar="doltlite-android-$VERSION.aar"
          url="https://repo.maven.apache.org/maven2/com/dolthub/doltlite-android/$VERSION/$aar"
          if curl -fsSL --max-time 20 "$url" -o "$RUNNER_TEMP/published.aar"; then
            cmp "candidate/$aar" "$RUNNER_TEMP/published.aar"
          else
            : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Maven Central username is required}"
            : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Maven Central password is required}"
            : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Maven Central signing key is required}"
            mkdir -p build/outputs/aar
            cp "candidate/$aar" build/outputs/aar/doltlite-android-release.aar
            ./gradlew publishAndReleaseToMavenCentral -x :bundleReleaseAar \
              -PdoltliteVersion="$VERSION" --no-daemon --no-configuration-cache
          fi

      - name: Resolve the exact published Maven package
        run: |
          aar="doltlite-android-$VERSION.aar"
          url="https://repo.maven.apache.org/maven2/com/dolthub/doltlite-android/$VERSION/$aar"
          for _ in {1..40}; do
            if curl -fsSL --max-time 15 "$url" -o "$RUNNER_TEMP/published.aar"; then
              break
            fi
            sleep 15
          done
          cmp "candidate/$aar" "$RUNNER_TEMP/published.aar"
          ./gradlew -p consumer assembleDebug assembleDebugAndroidTest --no-daemon \
            --refresh-dependencies -PdoltliteVersion="$VERSION"
